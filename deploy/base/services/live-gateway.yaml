apiVersion: apps/v1
kind: Deployment
metadata:
  name: live-gateway
  labels:
    app.kubernetes.io/name: live-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: live-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: live-gateway
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: live-gateway
          image: ghcr.io/abdelwahab313/flotilla-stream/live-gateway
          imagePullPolicy: IfNotPresent
          env:
            - name: LIVE_ADDR
              value: ":8080"
            - name: REDIS_ADDR
              value: redis.flotilla.svc:6379
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://tempo.observability.svc:4317
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: live-gateway
  labels:
    app.kubernetes.io/name: live-gateway
spec:
  selector:
    app.kubernetes.io/name: live-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http

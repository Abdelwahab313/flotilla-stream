apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: strimzi-kafka-operator
    repo: oci://quay.io/strimzi-helm
    version: 1.3.1
    releaseName: strimzi
    namespace: strimzi
    includeCRDs: true
    valuesInline:
      watchNamespaces:
        - flotilla
      resources:
        requests:
          cpu: 100m
          memory: 384Mi
        limits:
          cpu: "1"
          memory: 384Mi
